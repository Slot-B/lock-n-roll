services:
  postgres:
    image: postgres:16-alpine
    container_name: lnr-postgres
    environment:
      POSTGRES_USER: lnr
      POSTGRES_PASSWORD: lnr
      POSTGRES_DB: lock_n_roll
    ports:
      - "5433:5432"
    volumes:
      - lnr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnr -d lock_n_roll"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lnr_pg_data:
